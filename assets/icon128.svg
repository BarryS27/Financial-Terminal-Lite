<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background: near-black, not pure #000 -->
  <rect width="128" height="128" rx="24" fill="#0f1117"/>

  <!-- Clipper ship silhouette — side profile, near-white not pure #fff -->
  <!-- Hull -->
  <path d="M18 88 Q32 96 64 98 Q96 96 110 88 L104 82 Q80 88 64 90 Q48 88 24 82 Z"
        fill="#e8eaf0" opacity="0.95"/>
  <!-- Hull bottom keel line -->
  <path d="M24 82 Q64 86 104 82" stroke="#e8eaf0" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Main mast -->
  <line x1="64" y1="28" x2="64" y2="88" stroke="#e8eaf0" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>

  <!-- Foremast -->
  <line x1="44" y1="40" x2="44" y2="84" stroke="#e8eaf0" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Bowsprit — the signature clipper element jutting forward -->
  <line x1="44" y1="60" x2="14" y2="44" stroke="#e8eaf0" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Main sails (mainsail + topsail) -->
  <!-- Mainsail: large quadrilateral -->
  <path d="M64 30 L88 52 L88 82 L64 88 Z"
        fill="#e8eaf0" opacity="0.22"/>
  <path d="M64 30 L88 52 L88 82 L64 88 Z"
        stroke="#e8eaf0" stroke-width="1.2" fill="none" opacity="0.70"/>

  <!-- Foremast sails -->
  <path d="M44 42 L66 56 L66 80 L44 84 Z"
        fill="#e8eaf0" opacity="0.18"/>
  <path d="M44 42 L66 56 L66 80 L44 84 Z"
        stroke="#e8eaf0" stroke-width="1.0" fill="none" opacity="0.60"/>

  <!-- Bowsprit jib sail -->
  <path d="M44 58 L15 44 L44 76 Z"
        fill="#e8eaf0" opacity="0.16"/>
  <path d="M44 58 L15 44 L44 76 Z"
        stroke="#e8eaf0" stroke-width="1.0" fill="none" opacity="0.55"/>

  <!-- Top-gallant on main mast -->
  <path d="M64 28 L76 38 L76 52 L64 56 Z"
        fill="#e8eaf0" opacity="0.28"/>
  <path d="M64 28 L76 38 L76 52 L64 56 Z"
        stroke="#e8eaf0" stroke-width="0.9" fill="none" opacity="0.65"/>

  <!-- Yard arms (horizontal spars) -->
  <line x1="52" y1="52" x2="88" y2="52" stroke="#e8eaf0" stroke-width="1.4" stroke-linecap="round" opacity="0.70"/>
  <line x1="34" y1="62" x2="64" y2="62" stroke="#e8eaf0" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <line x1="58" y1="38" x2="78" y2="38" stroke="#e8eaf0" stroke-width="1.0" stroke-linecap="round" opacity="0.60"/>

  <!-- Rigging lines -->
  <line x1="64" y1="28" x2="110" y2="82" stroke="#e8eaf0" stroke-width="0.8" opacity="0.28" stroke-linecap="round"/>
  <line x1="64" y1="28" x2="18"  y2="82" stroke="#e8eaf0" stroke-width="0.8" opacity="0.22" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="64"  y2="56" stroke="#e8eaf0" stroke-width="0.7" opacity="0.25" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="18"  y2="82" stroke="#e8eaf0" stroke-width="0.7" opacity="0.20" stroke-linecap="round"/>

  <!-- Small waterline waves -->
  <path d="M16 94 Q24 91 32 94 Q40 97 48 94 Q56 91 64 94 Q72 97 80 94 Q88 91 96 94 Q104 97 112 94"
        stroke="#e8eaf0" stroke-width="1.2" fill="none" opacity="0.30" stroke-linecap="round"/>
</svg>
