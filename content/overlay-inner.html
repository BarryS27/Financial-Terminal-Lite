<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captain</title>
<style>
/* ── ACDN Token Layer — Captain v3 Precision/Control Theme ─────────────────── */
:root {
  /* Light mode: cool near-white, tight chroma */
  --color-bg:          oklch(97%   0.003 240);
  --color-surface:     oklch(93%   0.004 240);
  --color-border:      oklch(82%   0.006 240);
  --color-text:        oklch(22%   0.010 240);
  --color-text-muted:  oklch(52%   0.008 240);
  --color-accent:      oklch(48%   0.20  220);
  --color-accent-dim:  oklch(94%   0.06  220);
  --color-danger:      oklch(52%   0.20  15);

  /* Precision shell — no frosted softness, use crisp borders + shadow depth */
  --palette-bg:        oklch(98%   0.002 240);
  --palette-border:    oklch(78%   0.008 240);
  --shadow-lg: 0 0 0 1px oklch(0% 0 0 / 0.08), 0 12px 40px oklch(0% 0 0 / 0.14), 0 4px 12px oklch(0% 0 0 / 0.06);

  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg:          oklch(12%   0.004 240);
    --color-surface:     oklch(17%   0.005 240);
    --color-border:      oklch(26%   0.006 240);
    --color-text:        oklch(90%   0.008 240);
    --color-text-muted:  oklch(56%   0.008 240);
    --color-accent:      oklch(62%   0.18  220);
    --color-accent-dim:  oklch(20%   0.07  220);
    --color-danger:      oklch(62%   0.20  15);

    --palette-bg:        oklch(14%   0.004 240);
    --palette-border:    oklch(28%   0.006 240);
    --shadow-lg: 0 0 0 1px oklch(100% 0 0 / 0.06), 0 16px 48px oklch(0% 0 0 / 0.55), 0 4px 14px oklch(0% 0 0 / 0.30);
  }
}

/* ── Reset ──────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  color: var(--color-text);
}

::selection { background: oklch(48% 0.20 220 / 0.18); color: inherit; }

/* ── Backdrop — tight, not dreamy ───────────────────────────────────────────── */
#backdrop {
  position: fixed; inset: 0;
  background: oklch(0% 0 0 / 0.40);
  /* No backdrop blur — clarity over aesthetics in control UIs */
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 12vh;
}

/* ── Palette shell — ACDN $glass-none: sharp, bordered panel ───────────────── */
#palette {
  width: 620px;
  max-width: calc(100vw - 32px);
  background: var(--palette-bg);
  border: 1px solid var(--palette-border);
  border-radius: 8px;   /* ACDN $radius-md: tighter than glass-elevated 12px */
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: 66vh;
}

@media (prefers-reduced-motion: no-preference) {
  #palette {
    animation: panel-in 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
}
@media (prefers-reduced-motion: reduce) {
  #palette { animation: none; }
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(6px) scale(0.992); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}

/* ── Search row ─────────────────────────────────────────────────────────────── */
#search-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

#search-icon {
  width: 15px; height: 15px;
  flex-shrink: 0;
  color: var(--color-text-muted);
  opacity: 0.65;
}

/* ACDN filter chip — uppercase badge style */
#filter-chip {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 2px 7px 2px 8px;
  border-radius: 4px;
  border: 1px solid;
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
  line-height: 1.3;
}
#filter-chip-close {
  cursor: pointer;
  opacity: 0.55;
  font-size: 10px;
  line-height: 1;
  padding: 0 1px;
  transition: opacity 100ms ease;
}
#filter-chip-close:hover { opacity: 1; }

#search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  font-weight: 400;
  letter-spacing: 0.005em;
  caret-color: var(--color-accent);
  line-height: 1;
}
#search-input::placeholder {
  color: var(--color-text-muted);
  opacity: 0.50;
}

#kb-hint {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.07em;
  color: var(--color-text-muted);
  opacity: 0.55;
  white-space: nowrap;
  flex-shrink: 0;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: var(--font-sans);
  text-transform: uppercase;
  user-select: none;
}

/* ── Results list ───────────────────────────────────────────────────────────── */
#results {
  overflow-y: auto;
  overscroll-behavior: contain;
  max-height: calc(66vh - 50px);
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
#results:hover {
  scrollbar-color: var(--color-border) transparent;
}
#results::-webkit-scrollbar { width: 4px; }
#results::-webkit-scrollbar-track { background: transparent; }
#results::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 50px;
}
#results:hover::-webkit-scrollbar-thumb { background: var(--color-border); }
#results::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

#results:empty:not([data-loading])::after {
  content: 'No results';
  display: block;
  text-align: center;
  color: var(--color-text-muted);
  font-size: 0.8125rem;
  padding: 28px;
  opacity: 0.5;
  font-family: var(--font-sans);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
}

/* ── Section label — ACDN badge-uppercase ───────────────────────────────────── */
.section-label {
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  padding: 10px 14px 4px;
  opacity: 0.65;
  user-select: none;
}

/* ── Result row ─────────────────────────────────────────────────────────────── */
.result-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background-color 70ms ease;
  position: relative;
  border-left: 2px solid transparent;
}
.result-item:hover { background: var(--color-surface); }
.result-item.selected {
  background: var(--color-accent-dim);
  border-left-color: var(--color-accent);
}
@media (prefers-color-scheme: dark) {
  .result-item.selected {
    background: oklch(62% 0.18 220 / 0.10);
    border-left-color: var(--color-accent);
  }
}
/* ACDN: no scale on active for control UIs — scale implies playfulness */
.result-item:active { background: var(--color-surface); }

/* Icon */
.item-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border-radius: 4px;
}
.item-icon img {
  width: 15px; height: 15px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.10);
}
@media (prefers-color-scheme: dark) {
  .item-icon img { box-shadow: inset 0 0 0 1px oklch(100% 0 0 / 0.12); }
}

/* Text */
.item-text { flex: 1; min-width: 0; }
.item-title {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--color-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  letter-spacing: 0.005em;
}
.item-desc {
  font-size: 0.6875rem;
  color: var(--color-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
  line-height: 1.3;
  opacity: 0.75;
}
.item-desc mark {
  background: var(--color-accent-dim);
  color: var(--color-accent);
  border-radius: 2px;
  padding: 0 1px;
}

/* Key badges */
.item-keys { display: flex; gap: 3px; flex-shrink: 0; }
.key-badge {
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text-muted);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: var(--font-sans);
  line-height: 1.4;
  user-select: none;
}

/* Remove button */
.item-remove {
  width: 18px; height: 18px;
  opacity: 0;
  flex-shrink: 0;
  color: var(--color-text-muted);
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: opacity 100ms ease, color 100ms ease;
  cursor: pointer;
}
.result-item:hover .item-remove { opacity: 0.6; }
.item-remove:hover { opacity: 1 !important; color: var(--color-danger); }
</style>
</head>
<body>
<div id="backdrop">
  <div id="palette" role="dialog" aria-label="Captain command palette">
    <div id="search-row">
      <svg id="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <line x1="9.8" y1="9.8" x2="13.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span id="filter-chip"><span id="filter-chip-label"></span><span id="filter-chip-close" aria-label="Clear filter">✕</span></span>
      <input id="search-input" type="text" placeholder='Search or type "/" to filter' autocomplete="off" spellcheck="false" aria-label="Search">
      <span id="kb-hint" aria-hidden="true">⌘K</span>
    </div>
    <div id="results" role="listbox" aria-label="Results"></div>
  </div>
</div>
<script src="overlay-inner.js"></script>
</body>
</html>
