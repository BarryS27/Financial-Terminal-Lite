<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Time — Captain</title>
<link rel="stylesheet" href="shared.css">
<style>
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ACDN std-thin glass header — matches ai.html */
#app-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  flex-shrink: 0;
}
#app-header h1 {
  font-size: var(--text-base);
  font-weight: 600;
  flex: 1;
  margin: 0;
  letter-spacing: -0.01em;
}
.helm-icon { width: 20px; height: 20px; color: var(--color-accent); flex-shrink: 0; }

.range-toggle { display: flex; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-pill); padding: 2px; gap: 2px; }
.range-btn {
  border: none; background: none; font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 600;
  color: var(--color-text-muted); padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.range-btn.active { background: var(--color-accent); color: oklch(99% 0 0); }
.range-btn:hover:not(.active) { color: var(--color-text); }

.header-btn {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-base);
  font-family: var(--font-sans);
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.header-btn:hover { background: var(--color-surface); color: oklch(45% 0.18 15); }

/* Scrollable content */
#wt-main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px 40px;
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
#wt-main:hover { scrollbar-color: var(--color-border) transparent; }

.wt-hero { text-align: center; padding: 12px 0 24px; }
.wt-hero-value { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; color: var(--color-text); font-variant-numeric: tabular-nums; }
.wt-hero-label { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: 4px; }

/* 7-day mini bar chart */
.wt-chart { display: flex; align-items: flex-end; gap: 10px; height: 110px; padding: 0 4px 20px; border-bottom: 1px solid var(--color-border); margin-bottom: 24px; }
.wt-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
.wt-chart-bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; justify-content: center; }
.wt-chart-bar { width: 60%; max-width: 26px; min-height: 2px; background: var(--color-accent-dim); border-radius: 4px 4px 0 0; transition: height var(--dur-normal) var(--ease-out); }
.wt-chart-bar.today { background: var(--color-accent); }
.wt-chart-label { font-size: var(--text-xs); color: var(--color-text-muted); user-select: none; }

/* Ranked list */
.wt-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--color-border); }
.wt-row:last-child { border-bottom: none; }
.wt-row-rank { flex: 0 0 16px; font-size: var(--text-xs); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
.wt-row-dot {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: oklch(99% 0 0); font-size: 10px; font-weight: 700; letter-spacing: 0; user-select: none;
}
.wt-row-domain { flex: 1; min-width: 0; font-size: var(--text-sm); font-weight: 500; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt-row-bar-track { flex: 0 0 110px; height: 5px; border-radius: var(--radius-pill); background: var(--color-border); overflow: hidden; }
.wt-row-bar-fill { height: 100%; background: var(--color-accent); border-radius: var(--radius-pill); transition: width var(--dur-normal) var(--ease-out); }
.wt-row-time { flex: 0 0 56px; text-align: right; font-size: var(--text-xs); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }

.empty-state {
  text-align: center;
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  padding: 40px 20px;
}
</style>
</head>
<body>
<header id="app-header">
  <svg class="helm-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <circle cx="16" cy="16" r="13.5" stroke="currentColor" stroke-width="1.5"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="16" y1="12.5" x2="16" y2="4"/>
      <line x1="16" y1="19.5" x2="16" y2="28"/>
      <line x1="19.5" y1="16" x2="28" y2="16"/>
      <line x1="12.5" y1="16" x2="4"  y2="16"/>
      <line x1="18.3" y1="13.7" x2="24.5" y2="7.5"/>
      <line x1="13.7" y1="18.3" x2="7.5"  y2="24.5"/>
      <line x1="13.7" y1="13.7" x2="7.5"  y2="7.5"/>
      <line x1="18.3" y1="18.3" x2="24.5" y2="24.5"/>
    </g>
    <circle cx="16" cy="16" r="3" fill="currentColor"/>
    <circle cx="16" cy="2.5"   r="1.8" fill="currentColor"/>
    <circle cx="16" cy="29.5"  r="1.8" fill="currentColor"/>
    <circle cx="29.5" cy="16"  r="1.8" fill="currentColor"/>
    <circle cx="2.5"  cy="16"  r="1.8" fill="currentColor"/>
    <circle cx="26.2" cy="5.8"  r="1.8" fill="currentColor"/>
    <circle cx="5.8"  cy="26.2" r="1.8" fill="currentColor"/>
    <circle cx="5.8"  cy="5.8"  r="1.8" fill="currentColor"/>
    <circle cx="26.2" cy="26.2" r="1.8" fill="currentColor"/>
  </svg>
  <h1>Web Time</h1>
  <div class="range-toggle" id="range-toggle">
    <button class="range-btn active" data-range="today">Today</button>
    <button class="range-btn" data-range="week">Week</button>
    <button class="range-btn" data-range="alltime">All time</button>
  </div>
  <button class="header-btn" id="clear-btn">Clear…</button>
</header>

<main id="wt-main">
  <div class="wt-hero">
    <div class="wt-hero-value" id="wt-hero-value">0m</div>
    <div class="wt-hero-label" id="wt-hero-label">Active time today</div>
  </div>

  <div class="wt-chart" id="wt-chart"></div>

  <h3 style="margin:0 0 8px">By site</h3>
  <div class="field-group" id="wt-list" style="margin-bottom:0"></div>
  <div class="empty-state" id="wt-empty" style="display:none">Nothing tracked yet for this range.</div>

  <p class="panel-desc" id="wt-since" style="margin-top:24px;text-align:center"></p>
</main>
<script type="module" src="webtime.js"></script>
</body>
</html>
