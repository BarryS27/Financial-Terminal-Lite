<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault — Captain</title>
<link rel="stylesheet" href="shared.css">
<style>
body {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
}
.vault-card {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.20), var(--shadow-lg);
  border-radius: var(--radius-lg);
  padding: 40px 48px;
  max-width: 480px;
  width: 100%;
  animation: fade-up 280ms var(--ease-out) both;
}
.vault-icon {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px;
  background: var(--color-accent-dim);
  border-radius: var(--radius-base);
  color: var(--color-accent);
  font-size: 20px;
}
.vault-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.vault-header h1 { font-size: var(--text-lg); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.badge.locked { color: var(--color-text-muted); }

/* Unlock screen */
#unlock-screen { display: none; flex-direction: column; }
#unlock-screen p { font-size: var(--text-sm); color: var(--color-text-muted); margin: 4px 0 20px; }
.pw-row { display: flex; gap: 8px; }
.pw-row input { flex: 1; }
#file-hint { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 8px; min-height: 16px; }

/* Main screen */
#main-screen { display: none; flex-direction: column; }
.tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin-bottom: 16px; }
.tab-btn {
  padding: 8px 4px; margin-right: 16px; background: none; border: none; cursor: pointer;
  font-size: var(--text-sm); color: var(--color-text-muted); border-bottom: 2px solid transparent;
  font-family: inherit;
}
.tab-btn.active { color: var(--color-accent); border-bottom-color: var(--color-accent); font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.search-row input { flex: 1; }

.empty-state { text-align: center; color: var(--color-text-muted); font-size: var(--text-sm); padding: 32px 0; }

#entry-list { max-height: 360px; overflow-y: auto; margin-bottom: 12px; }
.entry-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px; border-bottom: 1px solid var(--color-border);
  cursor: pointer; border-radius: var(--radius-base);
  transition: background var(--dur-fast) var(--ease-out);
}
.entry-item:hover { background: var(--color-surface); }
.entry-item:last-child { border-bottom: none; }
.entry-avatar {
  width: 32px; height: 32px; flex-shrink: 0;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-base);
  display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden;
}
.entry-avatar img { width: 100%; height: 100%; object-fit: cover; }
.entry-info { flex: 1; min-width: 0; }
.entry-title { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-sub   { font-size: var(--text-xs); color: var(--color-text-muted); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--color-border); border-radius: var(--radius-base);
  background: none; cursor: pointer; color: var(--color-text-muted); font-size: 12px;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { color: var(--color-accent); border-color: var(--color-accent); }
.otp-badge {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
  color: var(--color-accent); background: var(--color-accent-dim);
  border-radius: 4px; padding: 1px 5px; vertical-align: middle; margin-left: 4px;
}

/* 2FA Codes tab */
#totp-list { max-height: 380px; overflow-y: auto; }
.account-row {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 4px; border-bottom: 1px solid var(--color-border);
}
.account-row:last-child { border-bottom: none; }
.account-ring {
  --pct: 100%;
  position: relative; flex-shrink: 0;
  width: 34px; height: 34px; border-radius: 50%;
  background: conic-gradient(var(--color-accent) var(--pct), var(--color-border) 0);
  display: flex; align-items: center; justify-content: center;
}
.account-ring::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--color-bg); }
.account-ring span { position: relative; font-size: 10px; font-weight: 600; color: var(--color-text-muted); font-family: var(--font-mono); }
.account-info { flex: 1; min-width: 0; }
.account-issuer { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-label  { font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-code   { font-size: var(--text-base); font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.04em; margin-top: 2px; }

/* Generator tab */
.gen-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.gen-slider-row { display: flex; align-items: center; gap: 10px; }
.gen-slider-row input[type="range"] { flex: 1; }
#gen-len-val { font-family: var(--font-mono); font-size: var(--text-sm); width: 24px; text-align: right; }
.gen-check-row { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); }
#gen-output {
  font-family: var(--font-mono); font-size: var(--text-sm);
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-base);
  padding: 10px 12px; margin: 12px 0; word-break: break-all; min-height: 20px;
}

/* Modal overlays (add/edit + settings) */
.modal-bg {
  position: fixed; inset: 0; background: oklch(0% 0 0 / 0.45);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  padding: 24px;
}
.modal-bg.hidden { display: none; }
.modal-box {
  background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 24px 28px; max-width: 420px; width: 100%;
  max-height: 85vh; overflow-y: auto;
}
.modal-box h2 { font-size: var(--text-base); font-weight: 600; margin: 0 0 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
#modal-error { color: oklch(45% 0.18 15); font-size: var(--text-xs); min-height: 16px; margin-top: 4px; }
.file-name { font-family: var(--font-mono); font-size: var(--text-sm); }
.file-name.set { color: var(--color-text); }
</style>
</head>
<body>
<div class="vault-card">
  <div class="vault-header">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="vault-icon">🔐</div>
      <h1>Vault</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="badge locked" id="lock-badge">Locked</span>
      <button class="btn btn-outline btn-sm" id="btn-settings" title="Settings">⚙️</button>
      <button class="btn btn-outline btn-sm" id="btn-lock" style="display:none">Lock</button>
    </div>
  </div>

  <!-- Unlock screen -->
  <div id="unlock-screen">
    <p>Enter your master password to unlock your credentials.</p>
    <div id="file-hint"></div>
    <div class="pw-row">
      <input type="password" id="master-pw" placeholder="Master password" autocomplete="current-password">
      <button class="btn btn-outline btn-sm" id="toggle-unlock-pw" type="button">Show</button>
      <button class="btn btn-primary" id="btn-unlock">Unlock</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="btn-select-file" style="width:100%">Select .kdbx file…</button>
    </div>
    <div class="status-bar" id="unlock-error"></div>
  </div>

  <!-- Main screen -->
  <div id="main-screen">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="entries">Entries</button>
      <button class="tab-btn" data-tab="totp">2FA Codes</button>
      <button class="tab-btn" data-tab="generator">Generator</button>
    </div>

    <div class="tab-content active" id="tab-entries">
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search credentials…">
        <button class="btn btn-primary btn-sm" id="btn-add">+ Add</button>
      </div>
      <div id="entry-list"></div>
    </div>

    <div class="tab-content" id="tab-totp">
      <div id="totp-list"></div>
    </div>

    <div class="tab-content" id="tab-generator">
      <div class="gen-options">
        <div class="gen-slider-row">
          <label for="gen-len" style="font-size:var(--text-sm);white-space:nowrap">Length</label>
          <input type="range" id="gen-len" min="8" max="64" value="20">
          <span id="gen-len-val">20</span>
        </div>
        <label class="gen-check-row"><input type="checkbox" id="gen-upper" checked> Uppercase (A–Z)</label>
        <label class="gen-check-row"><input type="checkbox" id="gen-lower" checked> Lowercase (a–z)</label>
        <label class="gen-check-row"><input type="checkbox" id="gen-digits" checked> Digits (0–9)</label>
        <label class="gen-check-row"><input type="checkbox" id="gen-symbols"> Symbols (!@#$…)</label>
      </div>
      <div id="gen-output">(click Generate)</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-generate">Generate</button>
        <button class="btn btn-outline" id="btn-copy-gen">Copy</button>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit entry modal -->
<div class="modal-bg hidden" id="modal-bg">
  <div class="modal-box">
    <h2 id="modal-title">Add Entry</h2>
    <input type="hidden" id="entry-uuid">
    <div class="modal-field"><label for="entry-title">Title</label><input type="text" id="entry-title"></div>
    <div class="modal-field"><label for="entry-username">Username</label><input type="text" id="entry-username"></div>
    <div class="modal-field">
      <label for="entry-password">Password</label>
      <div class="pw-row">
        <input type="password" id="entry-password">
        <button class="btn btn-outline btn-sm" id="toggle-pw" type="button">Show</button>
      </div>
    </div>
    <div class="modal-field"><label for="entry-url">URL</label><input type="url" id="entry-url"></div>
    <div class="modal-field"><label for="entry-notes">Notes</label><textarea id="entry-notes" rows="3"></textarea></div>
    <div class="modal-field">
      <label for="entry-otp">2FA secret <span style="font-weight:400">(otpauth:// URI or Base32 key)</span></label>
      <div class="pw-row">
        <input type="text" id="entry-otp" placeholder="Paste a secret, or scan a QR code">
        <button class="btn btn-outline btn-sm" id="btn-scan-qr" type="button">Scan QR</button>
      </div>
      <input type="file" id="qr-file" accept="image/*" style="display:none">
    </div>
    <div id="modal-error"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btn-modal-delete" style="margin-right:auto;display:none">Delete</button>
      <button class="btn btn-outline" id="btn-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-modal-save">Save</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-bg hidden" id="settings-bg">
  <div class="modal-box">
    <h2>Vault Settings</h2>
    <div class="field-group">
      <div class="field">
        <div class="field-label"><strong>Linked file</strong><span id="settings-file-name" class="file-name">(unknown)</span></div>
        <div class="field-control"><button class="btn btn-outline btn-sm" id="btn-change-file">Change…</button></div>
      </div>
      <div class="field">
        <div class="field-label"><strong>Forget file</strong><span>Unlink this vault and lock it</span></div>
        <div class="field-control"><button class="btn btn-danger btn-sm" id="btn-forget-file">Forget</button></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="btn-settings-close">Close</button>
    </div>
  </div>
</div>

<script type="module" src="vault.js"></script>
</body>
</html>
